<div class="sidebar" [class.sidebar-open]="isOpen">
  <h2>Navigation</h2>

  <!-- New / edit invoice -->
  <button
    class="nav-button"
    routerLink="/invoice"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    📄 Faktura
  </button>

  <!-- List of saved invoices -->
  <button
    class="nav-button"
    routerLink="/invoice/list"
    routerLinkActive="active"
  >
    🧾 Сите фактури
  </button>

  <!-- Gradezhna Kniga app -->
  <button
    class="nav-button"
    routerLink="/gradezhna-kniga"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    📖 Gradezhna Kniga
  </button>

  <button
    class="nav-button"
    routerLink="/gradezhna-kniga/list"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    🧾 Сите градежни книги
  </button>

  <!-- Admin (only for you) -->
  <button
    *ngIf="isAdmin$ | async"
    class="nav-button admin-button"
    routerLink="/admin"
    routerLinkActive="active"
  >
    🛠️ Admin Panel
  </button>

  <button (click)="logout()" class="logout-button">🚪 Logout</button>
</div>
